name: Build and Tests

on: 
    workflow_dispatch:

    push:
        branches: ['main', 'dev']

    pull_request:
        branches: ['main', 'dev']
        types: [opened, synchronize, reopened, ready_for_review]


jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: installs dependencies
              run: npm install

            - name: try to build
              run: npm run build
    
    tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: runs the full test suites
              run: npm run test